[project]
name = "halo-homeassistant"
version = "0.1.0"
description = "Whole-home lighting orchestration for Home Assistant (development foundation)."
requires-python = ">=3.14.2,<3.15"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "home-assistant-frontend==20260930.2",
    "homeassistant==2026.10.0",
    "pytest-homeassistant-custom-component==0.13.371",
    "ruff==0.16.10",
]

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --disable-socket --allow-unix-socket"
